# Portable package smoke test, shared by ci.yml and release.yml: unpack each
# package on its own OS the way a user would and run it there (docs/PORTABLE.md).
#
# The caller uploads an artifact holding the four archives and a SHA256SUMS that
# lists them (out/portable from packaging/portable/build.py, or a release
# directory from scripts/release/build_release.sh).
name: portable-test

on:
  workflow_call:
    inputs:
      artifact:
        description: "name of the workflow artifact with the archives + SHA256SUMS"
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64, ext: tar.gz }
          - { os: windows-latest, target: windows-x86_64, ext: zip }
          - { os: macos-latest, target: macos-arm64, ext: zip }
          # The plan named macos-13; that image has been retired. macos-15-intel
          # is GitHub's x86_64 macOS runner now.
          - { os: macos-15-intel, target: macos-x86_64, ext: zip }
    env:
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: dl

      - name: Check the archive against SHA256SUMS
        working-directory: dl
        run: |
          version=$(tr -d '\r\n' < ../VERSION)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          archive="beast-booter-$version-$TARGET.$EXT"
          grep -F "  $archive" SHA256SUMS > one.sum
          if command -v sha256sum > /dev/null; then sha256sum -c one.sum; else shasum -a 256 -c one.sum; fi

      # Unpack the way a user would, into a folder whose path has spaces.
      - name: Unpack (Linux, tar)
        if: runner.os == 'Linux'
        run: |
          dest="$RUNNER_TEMP/bb portable test"
          mkdir -p "$dest"
          tar xzf "dl/beast-booter-$VERSION-$TARGET.tar.gz" -C "$dest"
          pkg="$dest/beast-booter-$VERSION-$TARGET"
          {
            echo "PKG=$pkg"
            echo "PY=$pkg/runtime/bin/python3"
            echo "APP=$pkg/app"
          } >> "$GITHUB_ENV"

      - name: Unpack (macOS, ditto like Archive Utility)
        if: runner.os == 'macOS'
        run: |
          dest="$RUNNER_TEMP/bb portable test"
          mkdir -p "$dest"
          ditto -x -k "dl/beast-booter-$VERSION-$TARGET.zip" "$dest"
          pkg="$dest/beast-booter-$VERSION-$TARGET"
          res="$pkg/BeastBooter.app/Contents/Resources"
          {
            echo "PKG=$pkg"
            echo "PY=$res/runtime/bin/python3"
            echo "APP=$res/app"
          } >> "$GITHUB_ENV"
          # Symlinks and exec bits must survive unpacking; the plist must be valid.
          test -L "$res/runtime/bin/python3"
          test -x "$pkg/BeastBooter.app/Contents/MacOS/BeastBooter"
          test -x "$pkg/beast-booter.command"
          plutil -lint "$pkg/BeastBooter.app/Contents/Info.plist"
          file "$res/runtime/bin/python3.13"

      - name: Unpack (Windows, Expand-Archive like Explorer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'bb portable test'
          Expand-Archive -LiteralPath "dl\beast-booter-$env:VERSION-$env:TARGET.zip" -DestinationPath $dest
          # Forward slashes work for bash, Python and PowerShell alike.
          $pkg = (Join-Path $dest "beast-booter-$env:VERSION-$env:TARGET") -replace '\\', '/'
          Add-Content -Path $env:GITHUB_ENV -Value "PKG=$pkg"
          Add-Content -Path $env:GITHUB_ENV -Value "PY=$pkg/runtime/python.exe"
          Add-Content -Path $env:GITHUB_ENV -Value "APP=$pkg/app"

      # -B: without it the bundled Python writes .pyc files into the package
      # while it starts, and verify-package.py then (rightly) fails.
      - name: Verify the unpacked files against PACKAGE-MANIFEST.json
        run: '"$PY" -I -S -B "$PKG/verify-package.py" "$PKG"'

      - name: CLI --version and --help, GUI --selftest (Linux, headless via xvfb-run)
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q xvfb; }
          xvfb-run -a "$PY" -I packaging/portable/ci/smoke.py "$PKG" --clean-env --gui

      - name: CLI --version and --help, GUI --selftest (macOS)
        if: runner.os == 'macOS'
        run: '"$PY" -I packaging/portable/ci/smoke.py "$PKG" --clean-env --gui'

      - name: CLI --version and --help, GUI --selftest (Windows; python.exe and pythonw.exe)
        if: runner.os == 'Windows'
        run: '"$PY" -I packaging/portable/ci/smoke.py "$PKG" --gui'

      - name: BeastBooter.cmd returns at once and leaves the GUI running in pythonw.exe
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          # BeastBooter.cmd hands over to runtime\pythonw.exe with "start" and
          # exits, so its exit code says nothing about the GUI (the GUI's own
          # --selftest exit code is checked in the step above, which runs
          # pythonw.exe directly). This checks what a double-click does: the
          # console window closes at once, and the package's pythonw.exe keeps
          # the window running.
          $ErrorActionPreference = 'Stop'
          $pkg = $env:PKG -replace '/', '\'
          $pythonw = Join-Path $pkg 'runtime\pythonw.exe'
          $cmd = Start-Process -FilePath (Join-Path $pkg 'BeastBooter.cmd') -PassThru
          $null = $cmd.Handle  # keep a handle, so ExitCode can be read later
          if (-not $cmd.WaitForExit(30000)) { throw 'BeastBooter.cmd still runs after 30 s: its console window would stay open' }
          if ($cmd.ExitCode -ne 0) { throw "BeastBooter.cmd exited with $($cmd.ExitCode)" }
          $gui = $null
          foreach ($i in 1..60) {
            $gui = Get-CimInstance Win32_Process -Filter "Name = 'pythonw.exe'" |
              Where-Object { $_.ExecutablePath -eq $pythonw } | Select-Object -First 1
            if ($gui) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $gui) { throw "BeastBooter.cmd did not start $pythonw" }
          Write-Host "GUI process $($gui.ProcessId): $($gui.CommandLine)"
          if ($gui.CommandLine -notlike '*beast_booter_launch.py*--gui*') { throw 'pythonw.exe was not started on beast_booter_launch.py --gui' }
          Start-Sleep -Seconds 10
          if (-not (Get-Process -Id $gui.ProcessId -ErrorAction SilentlyContinue)) {
            throw 'the GUI exited within 10 s (the self-test step above shows its errors)'
          }
          Stop-Process -Id $gui.ProcessId -Force

      - name: Platform-independent installer unit tests (test_x_*.py) with the bundled runtime
        run: |
          shopt -s nullglob
          tests=(installer/tests/test_x_*.py)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::warning::no installer/tests/test_x_*.py yet"
            exit 0
          fi
          # TODO: test against "$PKG" itself once test_x_platforms_darwin.py's
          # fake osascript stops writing "#!<sys.executable>": a shebang cannot
          # hold the spaces in our test path. Until then, a space-free copy.
          unit="$RUNNER_TEMP/bb-unit"
          cp -R "$PKG" "$unit"
          py="${PY/#"$PKG"/$unit}"
          app="${APP/#"$PKG"/$unit}"
          # pytest goes into its own folder, never into the package's runtime.
          "$py" -m pip install --quiet --disable-pip-version-check --target "$RUNNER_TEMP/pytest-site" "pytest>=8,<10"
          # Next to the packaged sources, so conftest.py imports the packaged beastbooter.
          cp -R installer/tests "$app/tests"
          names=()
          for t in "${tests[@]}"; do names+=("$(basename "$t")"); done
          display=()
          if [ "$RUNNER_OS" = Linux ]; then
            # The real Tk window tests (test_x_gui_window.py) run on Linux only
            # when BB_GUI_TEST_DISPLAY names a display, so they never open
            # windows on a desktop by surprise: give them xvfb-run's display.
            # shellcheck disable=SC2016 # $DISPLAY must expand inside xvfb-run, not here
            display=(xvfb-run -a sh -c 'BB_GUI_TEST_DISPLAY=$DISPLAY exec "$@"' sh)
          fi
          cd "$app/tests"
          # -rfEs: list every failure, error and skip at the end. --basetemp: test
          # images go to the runner's temp dir. --maxfail: one broken fixture must
          # not hide the rest, but a runaway stops before the log drowns.
          PYTHONPATH="$RUNNER_TEMP/pytest-site" "${display[@]}" "$py" -s -B -m pytest -q --tb=short -rfEs \
            --maxfail=300 --basetemp "$RUNNER_TEMP/pytest-tmp" -p no:cacheprovider "${names[@]}"

      - name: Image install + info --json
        # TODO(lead wiring): on Windows/macOS this needs the pure-Python
        # partition/FAT/exFAT writers wired into the CLI (it still calls sfdisk,
        # mkfs and mtools). Remove continue-on-error once they are.
        continue-on-error: ${{ runner.os != 'Linux' }}
        run: |
          extra=()
          if [ "$RUNNER_OS" = Linux ]; then
            # The current Linux installer still uses these tools (and /usr/sbin).
            sudo apt-get update -q && sudo apt-get install -y -q exfatprogs dosfstools mtools
            extra=(--clean-env --extra-path /usr/sbin --extra-path /sbin)
          fi
          "$PY" -I packaging/portable/ci/smoke.py "$PKG" --image "${extra[@]}"

      - name: Real-device smoke test (Windows, throwaway virtual disk)
        if: runner.os == 'Windows'
        # TODO(lead wiring): needs list-devices, --progress-file and the
        # pure-Python formats in the CLI. Remove continue-on-error once wired.
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vhd = Join-Path $env:RUNNER_TEMP 'bb-smoke.vhdx'
          $dp = Join-Path $env:RUNNER_TEMP 'diskpart.txt'
          Set-Content -Path $dp -Encoding ascii -Value @(
            "create vdisk file=`"$vhd`" maximum=512 type=expandable",
            "select vdisk file=`"$vhd`"",
            "attach vdisk")
          diskpart /s $dp
          if ($LASTEXITCODE -ne 0) { throw "diskpart could not create the virtual disk" }
          try {
            $disk = Get-Disk | Where-Object { $_.Location -eq $vhd }
            if (-not $disk -or $disk.IsBoot -or $disk.IsSystem -or $disk.Size -gt 1GB) {
              throw "refusing: could not identify the throwaway virtual disk"
            }
            $dev = "\\.\PhysicalDrive$($disk.Number)"
            Write-Host "throwaway virtual disk: $dev ($($disk.Size) bytes, $($disk.FriendlyName))"
            $cli = Join-Path $env:PKG 'beast-booter.cmd'
            $progress = Join-Path $env:RUNNER_TEMP 'progress.jsonl'
            & $cli list-devices --json --all
            & $cli install --device $dev --allow-fixed-disk --yes --progress-file $progress
            if ($LASTEXITCODE -ne 0) { throw "install failed (exit $LASTEXITCODE)" }
            Get-Content $progress
            & $cli info --device $dev --json
            if ($LASTEXITCODE -ne 0) { throw "info failed (exit $LASTEXITCODE)" }
          } finally {
            Set-Content -Path $dp -Encoding ascii -Value @("select vdisk file=`"$vhd`"", "detach vdisk")
            diskpart /s $dp
          }

      - name: Real-device smoke test (macOS, throwaway RAM disk)
        if: runner.os == 'macOS'
        # TODO(lead wiring): needs list-devices, --progress-file and the
        # pure-Python formats in the CLI. Remove continue-on-error once wired.
        continue-on-error: true
        run: |
          # 512 MiB RAM disk without a file system: a whole disk nobody else uses.
          dev=$(hdiutil attach -nomount ram://1048576 | awk '{print $1}')
          case "$dev" in /dev/disk[0-9]*) ;; *) echo "unexpected device '$dev'"; exit 1 ;; esac
          trap 'hdiutil detach "$dev" -force || true' EXIT
          echo "throwaway RAM disk: $dev"
          diskutil info "$dev" | grep -E 'Media Name|Disk Size|Protocol|Virtual' || true
          cli="$PKG/beast-booter.command"
          "$cli" list-devices --json --all
          sudo "$cli" install --device "$dev" --allow-fixed-disk --yes --progress-file "$RUNNER_TEMP/progress.jsonl"
          cat "$RUNNER_TEMP/progress.jsonl"
          sudo "$cli" info --device "$dev" --json

      # Running the launchers (all with -B) must not have changed the package.
      - name: The package folder is unchanged after running it
        run: '"$PY" -I -S -B "$PKG/verify-package.py" "$PKG"'
