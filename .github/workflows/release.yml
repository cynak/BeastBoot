# Release: pushing a tag vX.Y.Z builds every release file with
# scripts/release/build_release.sh (the same script `make release` runs),
# smoke-tests the portable packages on Linux, Windows and macOS, attests build
# provenance for every file and publishes the GitHub Release (docs/RELEASING.md).
#
# Signing: the project's release key comes from the secrets BB_SB_KEY_PEM and
# BB_SB_CERT_PEM. A tag build without them fails: a throwaway key would make
# every release need a new MOK enrollment.
#
# Manual run (workflow_dispatch) with dry_run (the default): built with a
# throwaway key, marked unofficial, uploaded as workflow artifacts only - no
# release, no attestations. dry_run=false on a tag re-runs that tag's release.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: throwaway signing key, workflow artifacts only (no release, no attestations)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  OFFICIAL: ${{ github.event_name == 'push' || inputs.dry_run == false }}

jobs:
  probe:
    name: probe for KVM
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      container-options: ${{ steps.kvm.outputs.options }}
    steps:
      - id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "options=--device /dev/kvm" >> "$GITHUB_OUTPUT"
          else
            echo "options=" >> "$GITHUB_OUTPUT"
            echo "::notice::no /dev/kvm on the runner: the end-to-end QEMU tests will be skipped"
          fi

  build:
    name: build, test and scan (ubuntu:26.04)
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    # Container jobs default to `sh` (dash); the steps use bash.
    defaults:
      run:
        shell: bash
    container:
      image: ubuntu:26.04
      options: ${{ needs.probe.outputs.container-options }}
    outputs:
      official: ${{ steps.meta.outputs.official }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      version: ${{ steps.meta.outputs.version }}
    env:
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      # The packages scripts/bootstrap-tools.sh documents for a system-wide
      # install (QEMU/OVMF for the e2e tests), the toolchain of
      # the GRUB source build (build/grub/grubsrc.py: gcc ... libfreetype-dev),
      # plus what the beast-net and SBOM steps use. grub-common/grub2-common
      # give grub-mkfont and unicode.pf2; grub-efi-amd64-signed is only for the
      # e2e stub images.
      # shim is Debian's (a step below).
      - name: Install the build host packages
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends \
            ca-certificates curl git make openssl binutils xz-utils zstd kmod \
            python3 python3-pytest python3-virt-firmware python3-jsonschema \
            gcc autoconf automake autopoint bison flex gawk pkgconf patch libfreetype-dev dpkg-dev \
            grub-common grub2-common grub-efi-amd64-signed sbsigntool \
            mtools dosfstools exfatprogs ntfs-3g fdisk gdisk xorriso socat qemu-system-x86 ovmf \
            fonts-noto-core fonts-noto-mono

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the checkout (the container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache the pinned downloads (Python runtimes, beast-net packages, linux-firmware, GRUB source)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cache/pbs
            .tools/cache/beastnet
            .tools/cache/linux-firmware
            .tools/cache/grub-src/dl
            .tools/cache/wimboot/dl
            .tools/cache/beastmount/dl
            .tools/debian/debs
          key: release-dl-${{ hashFiles('packaging/portable/runtimes.lock', 'build/beastnet/packages.lock', 'build/beastnet/firmware.lock', 'build/grub/source.lock.json', 'build/wimboot/source.lock.json', 'build/winpe/mingw-w64.lock.json', 'build/shim/debian-shim.lock') }}

      # Debian's shim (signed through Microsoft UEFI CA 2011 and 2023) and its
      # MokManager, pinned by SHA-256 in build/shim/debian-shim.lock;
      # scripts/dev-env.sh points BB_SHIM_DIR at .tools/debian/root/usr/lib/shim.
      - name: Debian shim and MokManager (pinned)
        run: python3 -I build/shim/fetch.py fetch .tools/debian

      - name: Release signing key (secrets BB_SB_KEY_PEM, BB_SB_CERT_PEM)
        if: env.OFFICIAL == 'true'
        env:
          KEY_PEM: ${{ secrets.BB_SB_KEY_PEM }}
          CERT_PEM: ${{ secrets.BB_SB_CERT_PEM }}
        run: |
          if [ -z "$KEY_PEM" ] || [ -z "$CERT_PEM" ]; then
            echo "::error::the secrets BB_SB_KEY_PEM and BB_SB_CERT_PEM are not set; an official release must be signed with the project's release key (docs/RELEASING.md)"
            exit 1
          fi
          umask 077
          dir="$(mktemp -d "$RUNNER_TEMP/bb-key.XXXXXX")"
          chmod 0700 "$dir"
          printf '%s\n' "$KEY_PEM" > "$dir/beast-booter.key"
          printf '%s\n' "$CERT_PEM" > "$dir/beast-booter.crt"
          openssl x509 -in "$dir/beast-booter.crt" -outform DER -out "$dir/beast-booter.cer"
          echo "BB_KEY_DIR=$dir" >> "$GITHUB_ENV"

      - name: Throwaway signing key (dry run)
        if: env.OFFICIAL != 'true'
        run: |
          dir="$(mktemp -d "$RUNNER_TEMP/bb-key.XXXXXX")"
          BB_KEY_DIR="$dir" BB_KEY_CN="beast-booter dry-run throwaway key (run $GITHUB_RUN_ID)" build/keygen.sh
          echo "BB_KEY_DIR=$dir" >> "$GITHUB_ENV"

      - name: Gate baseline (the previous release's vulnerability report)
        if: env.OFFICIAL == 'true'
        run: |
          python3 -I - "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest" "$RUNNER_TEMP/baseline.json" <<'EOF'
          import json, sys, urllib.request
          url, out = sys.argv[1:]
          try:
              rel = json.load(urllib.request.urlopen(url, timeout=60))
          except Exception as e:  # first release, or no public release yet
              print(f"no previous release ({e}): every finding counts as new")
              sys.exit(0)
          asset = next((a for a in rel.get("assets", []) if a["name"].endswith("-vulnerabilities.json")), None)
          if asset:
              with open(out, "wb") as f:
                  f.write(urllib.request.urlopen(asset["browser_download_url"], timeout=120).read())
              print(f"baseline: {asset['name']} of {rel['tag_name']}")
          EOF
          if [ -f "$RUNNER_TEMP/baseline.json" ]; then
            echo "BB_RELEASE_GATE_BASELINE=$RUNNER_TEMP/baseline.json" >> "$GITHUB_ENV"
          fi

      - name: Build, test, scan and check the release files
        env:
          BB_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          BB_RELEASE_REPO: ${{ github.repository }}
          BB_RELEASE_ATTESTATIONS: ${{ env.OFFICIAL == 'true' && '1' || '0' }}
          # Optional repository variables (Settings > Secrets and variables > Variables)
          BB_RELEASE_CERT_SHA256: ${{ vars.BB_RELEASE_CERT_SHA256 }}
          BB_RELEASE_GATE: ${{ vars.BB_RELEASE_GATE }}
          BB_RELEASE_GATE_SEVERITY: ${{ vars.BB_RELEASE_GATE_SEVERITY }}
          BB_RELEASE_GATE_IGNORE_UNFIXED: ${{ vars.BB_RELEASE_GATE_IGNORE_UNFIXED }}
        run: |
          args=(--out out/release)
          if [ "$OFFICIAL" = true ]; then args+=(--official); fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::notice::no usable /dev/kvm in the container: end-to-end QEMU tests skipped"
            args+=(--skip-e2e)
          fi
          scripts/release/build_release.sh "${args[@]}"

      - name: Release metadata
        id: meta
        run: |
          python3 -I - out/release/_release/release.json >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(f"official={str(r['official']).lower()}")
          print(f"prerelease={str(r['prerelease']).lower()}")
          print(f"version={r['version']}")
          EOF
          cat out/release/_release/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: out/release
          if-no-files-found: error
          compression-level: 0 # already compressed
          retention-days: ${{ env.OFFICIAL == 'true' && 30 || 14 }}

      - name: Logs of a failed build
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-logs
          path: out/release/_release
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove the signing key
        if: always()
        run: |
          if [ -n "${BB_KEY_DIR:-}" ] && [ -d "$BB_KEY_DIR" ]; then
            find "$BB_KEY_DIR" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "$BB_KEY_DIR"
          fi

  portable-test:
    name: portable smoke
    needs: build
    uses: ./.github/workflows/portable-test.yml
    permissions:
      contents: read
    with:
      artifact: release-files

  publish:
    name: attest and publish the GitHub Release
    needs: [build, portable-test]
    if: needs.build.outputs.official == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: Check every file against SHA256SUMS
        working-directory: release
        run: sha256sum -c SHA256SUMS

      - name: Attest build provenance for every release file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/beast-booter-*
            release/SHA256SUMS

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=(--verify-tag --title "beast-booter $VERSION" --notes-file release/_release/RELEASE_NOTES.md)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          files=()
          while read -r _ name; do files+=("release/$name"); done < release/SHA256SUMS
          files+=(release/SHA256SUMS)
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" "${args[@]}" "${files[@]}"
