# LVM for beast-net Disk tools (docs/DISK_TOOLS.md, "Platform notes").
# No udev, no daemons: scans read /dev directly, nothing is written to a
# physical volume's metadata, no node/symlink work is delegated to udev.
devices {
	scan = [ "/dev" ]
	use_devicesfile = 0
	obtain_device_list_from_udev = 0
	external_device_info_source = "none"
	md_component_detection = 1
	multipath_component_detection = 0
	cache_dir = "/run/lvm"
}
global {
	# commands that would write LVM metadata (create, resize, remove, ...) fail
	metadata_read_only = 1
	use_lvmpolld = 0
	use_lvmlockd = 0
	locking_dir = "/run/lock/lvm"
}
activation {
	udev_sync = 0
	udev_rules = 0
	verify_udev_operations = 0
	monitoring = 0
	retry_deactivation = 1
	# read-only activation: pass --config 'activation { read_only_volume_list = ["<vg>"] }'
}
backup {
	backup = 0
	archive = 0
}
