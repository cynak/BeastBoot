# busybox mdev rules for beast-net (/dev comes from devtmpfs; these only keep
# the usual permissions and load drivers for hot-plugged devices).
null     0:0 666
zero     0:0 666
full     0:0 666
random   0:0 666
urandom  0:0 666
tty      0:5 666
ptmx     0:5 666
$MODALIAS=.* 0:0 660 @/usr/sbin/modprobe -qb "$MODALIAS"
