# Embedded early config of dist/bios/core.img (GRUB i386-pc).
#
# core.img is built with prefix (,msdos2)/grub, so GRUB starts with
# root=hdN,msdos2 on the disk it was booted from. This config makes the same
# core.img work on GPT drives too: it asks GRUB which partition map partition 2
# of the boot disk belongs to ("msdos" or "gpt") and points root/prefix at it.
# On an msdos drive the result is the built-in (hdN,msdos2)/grub; on a GPT
# drive it is (hdN,gpt2)/grub. Same disk only - other disks are never searched.
#
# GRUB runs embedded configs with its minimal "rescue" parser: only simple
# commands and variable expansion work (no if/else, &&, ||). Hence no
# "test -e $prefix/grub.cfg"; probing the partition map is the equivalent.
regexp --set=1:bb_disk "^([^,]+)," "$root"
probe --set=bb_pmap --partmap "($bb_disk,2)"
set root="$bb_disk,${bb_pmap}2"
set prefix="($root)/grub"
unset bb_disk
unset bb_pmap
