# Embedded early config of dist/esp/EFI/BOOT/grubx64.efi (GRUB x86_64-efi).
#
# It makes the menu inside this image the only one GRUB can start: grub.cfg,
# grub/beast/, the theme and the fonts are in the image's memdisk, inside what
# the beast-boot key signs (build.sh "EFI GRUB"). Nothing on the drive may
# take their place, with Secure Boot on or off.
#
# The image is built with the prefix /grub. GRUB completes a prefix without a
# device with the device it was started from, so at this point $root is the
# ESP and $prefix is (ESP)/grub. Then:
#
#   bb_boot_dev  keeps the ESP's device for the menu (main.cfg: bb_esp), which
#                reads its data files there (device.env, grubenv) and loads
#                the helper and wimboot from it.
#   fw_path      is unset. Ubuntu's GRUB (the patches under debian/patches/
#                network/, from Fedora) sets it to the directory of the EFI
#                binary, (ESP)/EFI/BOOT, and `normal` looks for
#                $fw_path/grub.cfg BEFORE $prefix/grub.cfg: a grub.cfg dropped
#                next to grubx64.efi would run instead of the menu. Unset, GRUB
#                goes straight to $prefix/grub.cfg (grub-core/normal/main.c,
#                grub_cmd_normal), every time `normal` runs without a file.
#   root, prefix point into the memdisk, so GRUB's first config is
#                (memdisk)/grub/grub.cfg and everything it finds through
#                $prefix (the menu scripts, hooks, theme, fonts, module and
#                command lists) is in the image.
#
# GRUB runs embedded configs with its minimal "rescue" parser, before normal
# mode: only simple commands and variable expansion work (no if/else, &&, ||),
# and a failing line does not stop the next. build.sh strips the comments (the
# rescue parser has none). tests/menu/test_signed_menu.py pins the four lines
# below; tests/e2e/test_e2e_signed_menu.py boots with a hostile grub.cfg in
# /EFI/BOOT/ and in /grub/ on the ESP.
set bb_boot_dev="$root"
unset fw_path
set root=memdisk
set prefix="(memdisk)/grub"
