<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
<title id="t">beast-booter: one USB drive, many ISOs, Secure Boot intact</title>
<desc id="d">Banner for beast-booter, an open-source, fully transparent multi-boot USB tool. It boots ISO files from a drive that stays normal exFAT storage, on legacy BIOS, UEFI, and UEFI with Secure Boot via a MOK key the user enrolls. Illustration: a USB stick with a shield and check mark next to a stack of discs.</desc>
<defs>
<style>text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif}</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#1A1740"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4F46E5" stop-opacity="0.45"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/></radialGradient>
<linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2E8F0"/><stop offset="0.35" stop-color="#C7D2FE"/><stop offset="0.65" stop-color="#F5D0FE"/><stop offset="1" stop-color="#A5F3FC"/></linearGradient>
<linearGradient id="tint0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset="0.5" stop-color="#E2E8F0"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
<linearGradient id="tint1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBBF24"/><stop offset="0.5" stop-color="#E2E8F0"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
<linearGradient id="tint2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset="0.5" stop-color="#E2E8F0"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#312E81"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#64748B"/><stop offset="0.45" stop-color="#E2E8F0"/><stop offset="1" stop-color="#64748B"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#3730A3"/></pattern>
<clipPath id="card"><rect width="1280" height="420" rx="24"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="420" fill="url(#bg)"/>
<rect x="760" y="0" width="520" height="420" fill="url(#dots)" opacity="0.5"/>
<circle cx="1030" cy="215" r="250" fill="url(#glow)"/>
</g>
<rect x="0.75" y="0.75" width="1278.5" height="418.5" rx="23.5" fill="none" stroke="#262B4A" stroke-width="1.5"/>
<text x="74" y="96" font-size="17" font-weight="700" letter-spacing="3" fill="#A5B4FC">OPEN-SOURCE MULTI-BOOT USB</text>
<text x="70" y="178" font-size="84" font-weight="800" letter-spacing="-2" fill="#F8FAFC">beast<tspan fill="#818CF8">-</tspan>booter</text>
<text x="73" y="228" font-size="28" font-weight="500" fill="#CBD5E1">One USB drive. Many ISOs. Secure Boot intact.</text>
<rect x="72" y="262" width="150" height="40" rx="20" fill="#1E1B4B" fill-opacity="0.75" stroke="#4338CA" stroke-width="1.5"/>
<text x="147" y="288.5" font-size="18" font-weight="600" text-anchor="middle" fill="#E0E7FF">Legacy BIOS</text>
<rect x="236" y="262" width="90" height="40" rx="20" fill="#1E1B4B" fill-opacity="0.75" stroke="#4338CA" stroke-width="1.5"/>
<text x="281" y="288.5" font-size="18" font-weight="600" text-anchor="middle" fill="#E0E7FF">UEFI</text>
<rect x="340" y="262" width="246" height="40" rx="20" fill="#1E1B4B" fill-opacity="0.75" stroke="#4338CA" stroke-width="1.5"/>
<text x="463" y="288.5" font-size="18" font-weight="600" text-anchor="middle" fill="#E0E7FF">Secure Boot via MOK</text>
<rect x="72" y="314" width="264" height="40" rx="20" fill="#1E1B4B" fill-opacity="0.75" stroke="#4338CA" stroke-width="1.5"/>
<text x="204" y="340.5" font-size="18" font-weight="600" text-anchor="middle" fill="#E0E7FF">Normal exFAT storage</text>
