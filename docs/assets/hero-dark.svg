<ellipse cx="955" cy="276" rx="118" ry="38" fill="#4C1D95"/><ellipse cx="955" cy="270" rx="118" ry="38" fill="url(#tint2)" stroke="#0B1120" stroke-opacity="0.35" stroke-width="1"/>
<ellipse cx="955" cy="252" rx="118" ry="38" fill="#475569"/><ellipse cx="955" cy="246" rx="118" ry="38" fill="url(#face)" stroke="#0B1120" stroke-opacity="0.35" stroke-width="1"/>
<ellipse cx="955" cy="246" rx="108" ry="34.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1"/>
