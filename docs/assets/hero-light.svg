<path d="M1137 156 L1167 168 V194 C1167 214 1154 228 1137 236 C1120 228 1107 214 1107 194 V168 Z" fill="#FFFFFF" opacity="0.95"/>
<path d="M1123 196 L1133 207 L1153 184" fill="none" stroke="#B01E2E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1102" y="266" width="54" height="12" rx="4" fill="#FFFFFF" opacity="0.85"/>
<rect x="1160" y="266" width="12" height="12" rx="4" fill="#F9D2D7"/>
<circle cx="1137" cy="320" r="8" fill="#B01E2E" stroke="#F9D2D7" stroke-opacity="0.6" stroke-width="2"/>
</g>
</svg>
