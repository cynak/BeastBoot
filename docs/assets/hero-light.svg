<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
<title id="t">beast-booter: one USB drive, many ISOs, Secure Boot intact</title>
<desc id="d">Banner for beast-booter, an open-source, fully transparent multi-boot USB tool. It boots ISO files from a drive that stays normal exFAT storage, on legacy BIOS, UEFI, and UEFI with Secure Boot via a MOK key the user enrolls. Illustration: a USB stick with a shield and check mark next to a stack of discs.</desc>
<defs>
<style>text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif}</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F5F6"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F9D2D7" stop-opacity="0.75"/><stop offset="1" stop-color="#F9D2D7" stop-opacity="0"/></radialGradient>
<linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.35" stop-color="#E1E1E4"/><stop offset="0.65" stop-color="#FDECEE"/><stop offset="1" stop-color="#E1E1E4"/></linearGradient>
<linearGradient id="tint0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF8A93"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FF8A93"/></linearGradient>
<linearGradient id="tint1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C6C6CC"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C6C6CC"/></linearGradient>
<linearGradient id="tint2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F9D2D7"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F9D2D7"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E0384A"/><stop offset="1" stop-color="#B01E2E"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A1A1AA"/><stop offset="0.45" stop-color="#F5F5F6"/><stop offset="1" stop-color="#A1A1AA"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#C6C6CC"/></pattern>
<clipPath id="card"><rect width="1280" height="420" rx="24"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="420" fill="url(#bg)"/>
<rect x="760" y="0" width="520" height="420" fill="url(#dots)" opacity="0.5"/>
<circle cx="1030" cy="215" r="250" fill="url(#glow)"/>
</g>
<rect x="0.75" y="0.75" width="1278.5" height="418.5" rx="23.5" fill="none" stroke="#E1E1E4" stroke-width="1.5"/>
<text x="74" y="96" font-size="17" font-weight="700" letter-spacing="3" fill="#B01E2E">OPEN-SOURCE MULTI-BOOT USB</text>
<text x="70" y="178" font-size="84" font-weight="800" letter-spacing="-2" fill="#18181B">beast<tspan fill="#D62839">-</tspan>booter</text>
<text x="73" y="228" font-size="28" font-weight="500" fill="#3F3F46">One USB drive. Many ISOs. Secure Boot intact.</text>
<rect x="72" y="262" width="150" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.9" stroke="#F9D2D7" stroke-width="1.5"/>
<text x="147" y="288.5" font-size="18" font-weight="600" text-anchor="middle" fill="#18181B">Legacy BIOS</text>
<rect x="236" y="262" width="90" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.9" stroke="#F9D2D7" stroke-width="1.5"/>
<text x="281" y="288.5" font-size="18" font-weight="600" text-anchor="middle" fill="#18181B">UEFI</text>
<rect x="340" y="262" width="246" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.9" stroke="#F9D2D7" stroke-width="1.5"/>
<text x="463" y="288.5" font-size="18" font-weight="600" text-anchor="middle" fill="#18181B">Secure Boot via MOK</text>
<rect x="72" y="314" width="264" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.9" stroke="#F9D2D7" stroke-width="1.5"/>
<text x="204" y="340.5" font-size="18" font-weight="600" text-anchor="middle" fill="#18181B">Normal exFAT storage</text>
