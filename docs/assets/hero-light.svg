<ellipse cx="955" cy="300" rx="118" ry="38" fill="#63636B"/><ellipse cx="955" cy="294" rx="118" ry="38" fill="url(#tint1)" stroke="#A1A1AA" stroke-opacity="0.55" stroke-width="1"/>
<ellipse cx="955" cy="276" rx="118" ry="38" fill="#D62839"/><ellipse cx="955" cy="270" rx="118" ry="38" fill="url(#tint2)" stroke="#A1A1AA" stroke-opacity="0.55" stroke-width="1"/>
<ellipse cx="955" cy="252" rx="118" ry="38" fill="#63636B"/><ellipse cx="955" cy="246" rx="118" ry="38" fill="url(#face)" stroke="#A1A1AA" stroke-opacity="0.55" stroke-width="1"/>
<ellipse cx="955" cy="246" rx="108" ry="34.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1"/>
<ellipse cx="955" cy="246" rx="88" ry="28.3" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
<path d="M955 246 L885 216 A118 38 0 0 1 937 208.4 Z" fill="#FFFFFF" opacity="0.55"/>
<path d="M955 246 L1025 276 A118 38 0 0 1 973 283.6 Z" fill="#FFFFFF" opacity="0.35"/>
<ellipse cx="955" cy="246" rx="30" ry="9.7" fill="#FFFFFF" stroke="#63636B" stroke-opacity="0.5" stroke-width="1"/>
