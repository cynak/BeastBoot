# beast-booter menu library: function definitions only.
#
# Sourced once by main.cfg. GRUB functions are global and survive configfile
# contexts; variables do not, so main.cfg exports every bb_* variable these
# functions read. GRUB script has no local variables and no arithmetic, so
# each function uses its own bb_<prefix>_* names.
#
# Note: function definitions take effect when the file is parsed, not when a
# line is executed, so a "function" statement can never be made conditional.
# The navigation code redefines bb_after_menu by sourcing nav-*.cfg instead.

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------

# bb_dbg TEXT...  -- machine-readable line, only when bb_debug=1
function bb_dbg {
  if [ "$bb_debug" = "1" ]; then
    echo "BEAST: $*"
  fi
}

# bb_dbg_nl  -- in debug mode, start a fresh output line. Used before the
# first BEAST: line after GRUB redrew the screen, so that line does not share
# a raw serial line with the escape codes of the screen it replaced.
function bb_dbg_nl {
  if [ "$bb_debug" = "1" ]; then
    echo ""
  fi
}

# bb_dry TEXT...  -- what a dry run would have executed (always printed)
function bb_dry {
  echo "BEAST: dryrun $*"
}

# bb_err CODE TEXT...  -- machine-readable error line
function bb_err {
  set bb_err_code="$1"
  shift
  bb_dbg "error $bb_err_code $*"
}

# bb_pause  -- wait until the user presses Esc (or F4), then return.
# GRUB has no "wait for any key" command in the embedded module set; sleep
# --interruptible returns early (non-zero) on Esc/F4, so loop until it does.
function bb_pause {
  echo ""
  echo "Press Esc to return to the menu."
  while sleep --interruptible 3600; do
    true
  done
}

# bb_finish  -- end of a failed action. Inside a menu entry GRUB itself shows
# "Press any key to continue..." when a GRUB command printed an error, so we
# only pause when that will not happen (autoboot, or no GRUB error printed).
# A dry run never pauses: it returns to the menu straight away.
function bb_finish {
  if [ "$bb_dryrun" = "1" ]; then
    return 0
  fi
  if [ "$bb_ctx" = "menu" -a "$bb_grub_err" = "1" ]; then
    return 0
  fi
  bb_pause
}

# ---------------------------------------------------------------------------
# Small helpers
# ---------------------------------------------------------------------------

# bb_upper STRING  -- ASCII hex letters to upper case, result in bb_upper_out
# (enough for filesystem UUIDs: GRUB prints NTFS serials in lower case,
# /dev/disk/by-uuid uses upper case).
function bb_upper {
  set bb_u_in="$1"
  set bb_upper_out=""
  while regexp --set=1:bb_u_c --set=2:bb_u_in -- '^(.)(.*)$' "$bb_u_in"; do
    if [ "$bb_u_c" = "a" ]; then set bb_u_c="A"
    elif [ "$bb_u_c" = "b" ]; then set bb_u_c="B"
    elif [ "$bb_u_c" = "c" ]; then set bb_u_c="C"
    elif [ "$bb_u_c" = "d" ]; then set bb_u_c="D"
    elif [ "$bb_u_c" = "e" ]; then set bb_u_c="E"
    elif [ "$bb_u_c" = "f" ]; then set bb_u_c="F"
    fi
    set bb_upper_out="$bb_upper_out$bb_u_c"
  done
}

# bb_hidden NAME  -- true for names the browser never lists: anything that
# starts with "." and layout.DATA_HIDDEN_DIRS (matched case-insensitively,
# because FAT shows 8.3-only names such as $RECYCLE.BIN in lower case).
# $Extend is NTFS metadata that GRUB's NTFS driver lists like a folder.
function bb_hidden {
  if regexp -- '^\.' "$1"; then
    return 0
  fi
  if regexp -- '^([bB][eE][aA][sS][tT]-[bB][oO][oO][tT][eE][rR]|[sS][yY][sS][tT][eE][mM] [vV][oO][lL][uU][mM][eE] [iI][nN][fF][oO][rR][mM][aA][tT][iI][oO][nN]|\$[rR][eE][cC][yY][cC][lL][eE]\.[bB][iI][nN]|\$[eE][xX][tT][eE][nN][dD]|[lL][oO][sS][tT]\+[fF][oO][uU][nN][dD])$' "$1"; then
    return 0
  fi
  return 1
}

# bb_serial_enable  -- mirror the menu on serial port 0 (115200 8N1).
function bb_serial_enable {
  if [ "$bb_serial_on" = "1" ]; then
    return 0
  fi
  if serial --unit=0 --speed=115200; then
    terminal_input console serial
    terminal_output console serial
    set bb_serial_on=1
    export bb_serial_on
  fi
}

# bb_serial_wide  -- with bb_debug=1, tell GRUB the serial terminal is very
# wide, so it does not word-wrap long BEAST: lines (default: 80 columns).
function bb_serial_wide {
  if [ "$bb_serial_on" = "1" -a "$bb_debug" = "1" ]; then
    terminfo -g 1024x50 serial
  fi
}

# ---------------------------------------------------------------------------
# Directory listing
# ---------------------------------------------------------------------------

# bb_list DIR MODE
#   DIR   directory on the data partition ("/" or "/a/b", no trailing slash)
#   MODE  "menu"  = create the menu entries and print BEAST: lines
#         "print" = only print the BEAST: lines (used when a menu reappears)
# Order: ".." (sub-directories only), directories, then ISO files. Both
# groups are sorted by name (byte order, so upper case sorts first).
function bb_list {
  set bb_l_dir="$1"
  set bb_l_mode="$2"
  bb_dbg_nl
  bb_dbg "dir $bb_l_dir"
  if [ "$bb_l_dir" = "/" ]; then
    set bb_l_pfx="/"
  else
    set bb_l_pfx="$bb_l_dir/"
  fi
  if [ "$bb_l_mode" = "menu" ]; then
    if [ "$bb_l_dir" != "/" ]; then
      menuentry ".." --class=up --hotkey=backspace {
        bb_up
      }
    fi
  fi
  bb_scan dir
  bb_scan iso
}

# bb_scan KIND  (KIND = dir | iso)
# GRUB's wildcard returns entries in on-disk order and there are no arrays,
# so this is a selection sort: each pass over the directory keeps the four
# smallest entries greater than the last one emitted (bb_s_m1..bb_s_m4) and
# emits them. All entries share the same prefix, so whole paths are compared
# and the name is only extracted for candidates.
function bb_scan {
  set bb_s_kind="$1"
  set bb_s_last=""
  while true; do
    set bb_s_m1=""
    set bb_s_m2=""
    set bb_s_m3=""
    set bb_s_m4=""
    for bb_s_f in "($bb_data)$bb_l_pfx"*; do
      if [ -n "$bb_s_last" ]; then
        if [ "$bb_s_f" ">" "$bb_s_last" ]; then
          true
        else
          continue
        fi
      fi
      if [ -n "$bb_s_m4" ]; then
        if [ "$bb_s_f" "<" "$bb_s_m4" ]; then
          true
        else
          continue
        fi
      fi
      if bb_want "$bb_s_f"; then
        true
      else
        continue
      fi
      if [ -z "$bb_s_m1" ]; then
        set bb_s_m1="$bb_s_f"
      elif [ "$bb_s_f" "<" "$bb_s_m1" ]; then
        set bb_s_m4="$bb_s_m3"
        set bb_s_m3="$bb_s_m2"
        set bb_s_m2="$bb_s_m1"
        set bb_s_m1="$bb_s_f"
      elif [ -z "$bb_s_m2" ]; then
        set bb_s_m2="$bb_s_f"
      elif [ "$bb_s_f" "<" "$bb_s_m2" ]; then
        set bb_s_m4="$bb_s_m3"
        set bb_s_m3="$bb_s_m2"
        set bb_s_m2="$bb_s_f"
      elif [ -z "$bb_s_m3" ]; then
        set bb_s_m3="$bb_s_f"
      elif [ "$bb_s_f" "<" "$bb_s_m3" ]; then
        set bb_s_m4="$bb_s_m3"
        set bb_s_m3="$bb_s_f"
      else
        set bb_s_m4="$bb_s_f"
      fi
    done
    if [ -z "$bb_s_m1" ]; then
      break
    fi
    bb_emit "$bb_s_m1"
    set bb_s_last="$bb_s_m1"
    if [ -n "$bb_s_m2" ]; then
      bb_emit "$bb_s_m2"
      set bb_s_last="$bb_s_m2"
    fi
    if [ -n "$bb_s_m3" ]; then
      bb_emit "$bb_s_m3"
      set bb_s_last="$bb_s_m3"
    fi
    if [ -z "$bb_s_m4" ]; then
      break
    fi
    bb_emit "$bb_s_m4"
    set bb_s_last="$bb_s_m4"
  done
}

# bb_want PATH  -- true if the glob result PATH is listed in the current
# bb_scan phase (bb_s_kind); sets bb_w_name to its file name.
function bb_want {
  if regexp --set=1:bb_w_name -- '/([^/]+)$' "$1"; then
    true
  else
    return 1
  fi
  if bb_hidden "$bb_w_name"; then
    return 1
  fi
  if [ "$bb_s_kind" = "dir" ]; then
    if [ -d "$1" ]; then
      return 0
    fi
    return 1
  fi
  if regexp -- '\.[iI][sS][oO]$' "$bb_w_name"; then
    if [ -f "$1" ]; then
      return 0
    fi
  fi
  return 1
}

# bb_emit PATH  -- one directory or ISO found by bb_scan (PATH is the glob
# result). menuentry passes its title as $1 and the extra arguments as
# $2... "--" ends option parsing, so a name that starts with "-" is not taken
# for an option (regexp gets "--" for the same reason).
function bb_emit {
  regexp --set=1:bb_e_name -- '/([^/]+)$' "$1"
  if [ "$bb_l_dir" = "/" ]; then
    set bb_e_path="/$bb_e_name"
  else
    set bb_e_path="$bb_l_dir/$bb_e_name"
  fi
  if [ "$bb_s_kind" = "dir" ]; then
    bb_dbg "item dir $bb_e_path"
    if [ "$bb_l_mode" = "menu" ]; then
      menuentry --class=folder -- "$bb_e_name/" "$bb_e_path" {
        bb_enter "$2"
      }
    fi
  else
    bb_dbg "item iso $bb_e_path"
    if [ "$bb_l_mode" = "menu" ]; then
      bb_iso_class "$bb_e_name"
      menuentry --class="$bb_c_out" --class=iso -- "$bb_e_name" "$bb_e_path" {
        bb_boot_iso "$2" menu
      }
    fi
  fi
}

# bb_iso_class NAME  -- icon class for an ISO entry, guessed from its file
# name (only the icon of the graphical menu depends on it; booting does not).
# Result in bb_c_out: windows, mint, ubuntu, debian, fedora, arch, suse,
# linux or iso. Letter case is ignored ([aA] classes: regexp has no -i).
function bb_iso_class {
  set bb_c_out=iso
  if regexp -- '[wW][iI][nN]([dD][oO][wW][sS]|7|8|1[01]|[_-])' "$1"; then
    set bb_c_out=windows
  elif regexp -- '[mM][iI][nN][tT]' "$1"; then
    set bb_c_out=mint
  elif regexp -- '[uU][bB][uU][nN][tT][uU]|[pP][oO][pP][-_]?[oO][sS]|[zZ][oO][rR][iI][nN]|[eE][lL][eE][mM][eE][nN][tT][aA][rR][yY]' "$1"; then
    set bb_c_out=ubuntu
  elif regexp -- '[dD][eE][bB][iI][aA][nN]|[kK][aA][lL][iI]|[tT][aA][iI][lL][sS]|[dD][eE][vV][uU][aA][nN]|^[mM][xX][-_]' "$1"; then
    set bb_c_out=debian
  elif regexp -- '[fF][eE][dD][oO][rR][aA]|[rR][hH][eE][lL]|[cC][eE][nN][tT][oO][sS]|[rR][oO][cC][kK][yY]|[aA][lL][mM][aA][lL][iI][nN][uU][xX]|[nN][oO][bB][aA][rR][aA]' "$1"; then
    set bb_c_out=fedora
  elif regexp -- '[aA][rR][cC][hH]|[mM][aA][nN][jJ][aA][rR][oO]|[eE][nN][dD][eE][aA][vV][oO][uU][rR]|[cC][aA][cC][hH][yY]|[gG][aA][rR][uU][dD][aA]' "$1"; then
    set bb_c_out=arch
  elif regexp -- '[sS][uU][sS][eE]|[tT][uU][mM][bB][lL][eE][wW][eE][eE][dD]' "$1"; then
    set bb_c_out=suse
  elif regexp -- '[lL][iI][nN][uU][xX]' "$1"; then
    set bb_c_out=linux
  fi
}

# ---------------------------------------------------------------------------
# Navigation
#
# A sub-directory menu runs one nested "normal" level deeper than its parent
# menu (level.cfg), and inside that a configfile context (browse.cfg), which
# gives it its own menu and variables and makes Esc return. ".." leaves the
# level with normal_exit, which makes GRUB close every menu of that level, so
# both ".." and Esc land on the parent menu and nesting never grows beyond
# the directory depth. bb_after_menu tells level.cfg whether it still has to
# call normal_exit itself (Esc) or ".." already did (calling it twice would
# also close the parent).
# ---------------------------------------------------------------------------

# bb_enter DIR  -- show the menu for DIR; returns when the user goes back.
function bb_enter {
  set bb_next="$1"
  export bb_next
  source "$bb_cfg/nav-exit.cfg"
  normal "$bb_cfg/level.cfg"
  source "$bb_cfg/nav-exit.cfg"
  if [ "$bb_debug" = "1" ]; then
    bb_list "$bb_path" print
  fi
}

# bb_up  -- the ".." entry.
function bb_up {
  source "$bb_cfg/nav-up.cfg"
  normal_exit
}

# ---------------------------------------------------------------------------
# Booting an ISO (docs/ARCHITECTURE.md section 6, docs/ISO_SUPPORT.md)
# ---------------------------------------------------------------------------

# bb_loop_free  -- forget a previous loop device, if any.
function bb_loop_free {
  if [ -e "(loop)/" ]; then
    loopback -d loop
  fi
}

# bb_boot_iso PATH CTX
#   PATH  ISO path on the data partition (starts with "/")
#   CTX   "menu" (selected in the menu) or "auto" (bb_autoboot)
# Returns only if nothing was booted (dry run, unsupported ISO, failure).
function bb_boot_iso {
  set bb_iso="$1"
  set bb_ctx="$2"
  set bb_grub_err=0
  set bb_recipe=none
  bb_dbg_nl
  if ! regexp -- '^/' "$bb_iso"; then
    set bb_iso="/$bb_iso"
  fi
  # Written as a positive test on purpose: "[ ! -f p ]" that comes out true
  # after a lookup error (missing parent folder) makes GRUB print that error.
  if [ -f "($bb_data)$bb_iso" ]; then
    true
  else
    bb_err iso-not-found "$bb_iso"
    echo "The ISO file was not found on the data partition:"
    echo "  $bb_iso"
    bb_finish
    return 1
  fi
  bb_loop_free
  if ! loopback loop "($bb_data)$bb_iso"; then
    set bb_grub_err=1
    bb_err loopback-failed "$bb_iso"
    echo ""
    echo "GRUB could not open this file as a disk image:"
    echo "  $bb_iso"
    echo "The file may be damaged, or it is not an ISO image."
    bb_finish
    return 1
  fi
  bb_detect
  bb_dbg "boot $bb_iso recipe=$bb_recipe"
  set bb_label=""
  if [ "$bb_recipe" = "archiso" -o "$bb_recipe" = "dracut-live" ]; then
    probe --label --set=bb_label (loop)
  fi

  if [ "$bb_recipe" = "loopback" ]; then
    bb_r_loopback
  elif [ "$bb_recipe" = "windows" ]; then
    bb_r_windows
  elif [ "$bb_recipe" = "none" ]; then
    bb_r_none
  elif [ "$bb_recipe" = "efi-chainload" ]; then
    bb_r_efi_chainload
  else
    bb_r_linux
  fi
  bb_loop_free
  return 1
}

# bb_detect  -- sets bb_recipe. Order matters: the first match wins.
function bb_detect {
  set bb_recipe=none
  if [ -f (loop)/boot/grub/loopback.cfg ]; then
    set bb_recipe=loopback
  elif [ -f (loop)/casper/vmlinuz ]; then
    set bb_recipe=casper
  elif [ -f (loop)/live/vmlinuz ]; then
    set bb_recipe=live-boot
  elif [ -f (loop)/arch/boot/x86_64/vmlinuz-linux ]; then
    set bb_recipe=archiso
  elif [ -f (loop)/LiveOS/squashfs.img -a -f (loop)/images/pxeboot/vmlinuz ]; then
    set bb_recipe=dracut-live
  elif [ -f (loop)/images/pxeboot/vmlinuz -a ! -e (loop)/LiveOS ]; then
    set bb_recipe=anaconda
  elif [ -f (loop)/boot/x86_64/loader/linux ]; then
    set bb_recipe=suse
  elif [ -f (loop)/sources/boot.wim ]; then
    if [ -f (loop)/bootmgr -o -f (loop)/efi/microsoft/boot/bcd ]; then
      set bb_recipe=windows
    fi
  fi
  if [ "$bb_recipe" = "none" -a "$bb_platform" = "efi" ]; then
    if bb_find_efi_loader; then
      set bb_recipe=efi-chainload
    fi
  fi
}

# bb_find_efi_loader  -- /EFI/BOOT/BOOTX64.EFI in any letter case inside the
# ISO; sets bb_efi_loader to the path as it is spelled on the ISO.
function bb_find_efi_loader {
  set bb_efi_loader=""
  for bb_f1 in (loop)/*; do
    if regexp -- '^\(loop\)/[eE][fF][iI]$' "$bb_f1"; then
      for bb_f2 in "$bb_f1"/*; do
        if regexp -- '/[bB][oO][oO][tT]$' "$bb_f2"; then
          for bb_f3 in "$bb_f2"/*; do
            if regexp -- '/[bB][oO][oO][tT][xX]64\.[eE][fF][iI]$' "$bb_f3"; then
              if [ -f "$bb_f3" ]; then
                set bb_efi_loader="$bb_f3"
              fi
            fi
          done
        fi
      done
    fi
  done
  if [ -n "$bb_efi_loader" ]; then
    return 0
  fi
  return 1
}

# bb_linux KERNEL PARAM...  -- load a kernel, or print it in a dry run.
# Sets bb_ok=1 on success. GRUB passes a parameter that contains spaces to
# the kernel wrapped in double quotes; the dry-run line shows it the same way.
function bb_linux {
  set bb_ok=0
  set bb_k="$1"
  shift
  if [ "$bb_dryrun" = "1" ]; then
    set bb_cl=""
    for bb_a in "$@"; do
      if regexp -- ' ' "$bb_a"; then
        set bb_a="\"$bb_a\""
      fi
      if [ -z "$bb_cl" ]; then
        set bb_cl="$bb_a"
      else
        set bb_cl="$bb_cl $bb_a"
      fi
    done
    bb_dry "linux $bb_k $bb_cl"
    set bb_ok=1
    return 0
  fi
  if linux "$bb_k" "$@"; then
    set bb_ok=1
  fi
}

# bb_initrd FILE...  -- load initrd(s), or print them in a dry run.
# Sets bb_ok=1 on success.
function bb_initrd {
  set bb_ok=0
  if [ "$bb_dryrun" = "1" ]; then
    bb_dry "initrd $*"
    set bb_ok=1
    return 0
  fi
  if initrd "$@"; then
    set bb_ok=1
  fi
}

# bb_r_linux  -- recipes that boot a kernel + initrd from the ISO
# (casper, live-boot, archiso, dracut-live, anaconda, suse).
function bb_r_linux {
  set bb_ird=""
  if [ "$bb_recipe" = "casper" ]; then
    for bb_i in initrd initrd.lz initrd.gz initrd.img; do
      if [ -z "$bb_ird" -a -f "(loop)/casper/$bb_i" ]; then
        set bb_ird="(loop)/casper/$bb_i"
      fi
    done
    set bb_kern="(loop)/casper/vmlinuz"
  elif [ "$bb_recipe" = "live-boot" ]; then
    set bb_kern="(loop)/live/vmlinuz"
    set bb_ird="(loop)/live/initrd.img"
  elif [ "$bb_recipe" = "archiso" ]; then
    set bb_kern="(loop)/arch/boot/x86_64/vmlinuz-linux"
    set bb_ird="(loop)/arch/boot/x86_64/initramfs-linux.img"
  elif [ "$bb_recipe" = "suse" ]; then
    set bb_kern="(loop)/boot/x86_64/loader/linux"
    set bb_ird="(loop)/boot/x86_64/loader/initrd"
  else
    set bb_kern="(loop)/images/pxeboot/vmlinuz"
    set bb_ird="(loop)/images/pxeboot/initrd.img"
  fi
  if [ -z "$bb_ird" ]; then
    bb_err boot-failed "$bb_iso no initrd found"
    echo "This ISO looks like a $bb_recipe system, but its initrd is missing."
    bb_finish
    return 1
  fi

  if [ "$bb_recipe" = "casper" ]; then
    bb_linux "$bb_kern" boot=casper "iso-scan/filename=$bb_iso" quiet splash ---
  elif [ "$bb_recipe" = "live-boot" ]; then
    bb_linux "$bb_kern" boot=live "findiso=$bb_iso" components quiet splash
  elif [ "$bb_recipe" = "archiso" ]; then
    bb_linux "$bb_kern" archisobasedir=arch "archisolabel=$bb_label" "img_dev=/dev/disk/by-uuid/$bb_data_uuid_linux" "img_loop=$bb_iso"
  elif [ "$bb_recipe" = "dracut-live" ]; then
    bb_linux "$bb_kern" "root=live:CDLABEL=$bb_label" rd.live.image "iso-scan/filename=$bb_iso" quiet
  elif [ "$bb_recipe" = "anaconda" ]; then
    bb_linux "$bb_kern" "inst.stage2=hd:UUID=$bb_data_uuid_linux:$bb_iso" quiet
  else
    bb_linux "$bb_kern" "isofrom_device=/dev/disk/by-uuid/$bb_data_uuid_linux" "isofrom_system=$bb_iso" splash=silent
  fi
  if [ "$bb_ok" != "1" ]; then
    bb_fail linux
    return 1
  fi
  bb_initrd "$bb_ird"
  if [ "$bb_ok" != "1" ]; then
    bb_fail initrd
    return 1
  fi
  if [ "$bb_dryrun" = "1" ]; then
    return 0
  fi
  boot
  bb_fail boot
  return 1
}

# bb_r_loopback  -- the ISO ships its own GRUB config for loop booting.
function bb_r_loopback {
  set iso_path="$bb_iso"
  export iso_path
  if [ "$bb_dryrun" = "1" ]; then
    bb_dry "configfile (loop)/boot/grub/loopback.cfg"
    return 0
  fi
  set bb_saved_root="$root"
  set root=loop
  export root
  configfile /boot/grub/loopback.cfg
  set root="$bb_saved_root"
  export root
}

# bb_r_efi_chainload  -- start the ISO's own UEFI boot loader.
function bb_r_efi_chainload {
  if [ "$bb_dryrun" = "1" ]; then
    bb_dry "chainloader $bb_efi_loader"
    return 0
  fi
  echo "Starting the ISO's own UEFI boot loader:"
  echo "  $bb_efi_loader"
  echo "Many ISOs cannot find their files when started this way (they expect"
  echo "to be on a CD or a USB stick of their own). If it fails, see"
  echo "docs/ISO_SUPPORT.md."
  sleep --interruptible 3
  if ! chainloader "$bb_efi_loader"; then
    bb_fail chainloader
    return 1
  fi
  boot
  bb_fail boot
  return 1
}

# bb_r_windows  -- Windows installer ISOs are not supported in 0.1.
function bb_r_windows {
  bb_err unsupported-windows "$bb_iso"
  echo "This is a Windows installation ISO:"
  echo "  $bb_iso"
  echo ""
  echo "beast-booter 0.1 cannot boot Windows ISOs. Windows setup needs the"
  echo "ISO's files on a disk of their own, which this version does not provide."
  echo "Write the ISO to a separate USB stick with a dedicated tool instead."
  bb_finish
}

# bb_r_none  -- no recipe matched.
function bb_r_none {
  bb_err no-recipe "$bb_iso"
  echo "beast-booter does not know how to boot this ISO:"
  echo "  $bb_iso"
  echo ""
  echo "It has none of the boot layouts beast-booter recognises (a GRUB"
  echo "loopback.cfg, casper, live-boot, archiso, Fedora/RHEL, openSUSE"
  if [ "$bb_platform" = "efi" ]; then
    echo "or a UEFI boot loader)."
  else
    echo "or, on UEFI only, a UEFI boot loader)."
  fi
  echo "See docs/ISO_SUPPORT.md for what is supported."
  bb_finish
}

# bb_fail STAGE  -- loading or starting the kernel/boot loader failed.
# STAGE is linux, initrd, chainloader or boot. GRUB has already printed its
# own error message above ours.
function bb_fail {
  set bb_grub_err=1
  if [ "$bb_sb" = "1" ]; then
    bb_err sb-verify-failed "$bb_iso $1 failed"
    echo ""
    echo "Secure Boot stopped this ISO from starting."
    echo "Its kernel or boot loader is not signed by a key this machine trusts"
    echo "(GRUB error above). beast-booter does not work around this. You can:"
    echo "  1. enroll the distribution's signing key with \"Enroll a key"
    echo "     (MokManager)\" in the main menu, if the distribution publishes one;"
    echo "  2. use a release of the distribution that supports Secure Boot; or"
    echo "  3. turn Secure Boot off in the firmware settings."
  else
    bb_err boot-failed "$bb_iso $1 failed"
    echo ""
    echo "Booting this ISO failed while running \"$1\" (GRUB error above)."
    echo "The ISO may be damaged or use a layout beast-booter does not handle."
  fi
  bb_finish
}

# ---------------------------------------------------------------------------
# Graphical menu (docs/MENU.md "Graphical menu")
#
# The theme lives in $prefix/themes/beast/ (generated by build/theme/
# mktheme.py) and uses fonts from $prefix/fonts/. Every step is checked; if
# one fails, the menu stays the plain text menu, exactly as without graphics.
# ---------------------------------------------------------------------------

# bb_gfx_init  -- switch to the themed menu unless bb_gfx=0. Sets bb_gfx_on=1
# when it did. Called once, after the user configuration was read.
function bb_gfx_init {
  set bb_gfx_on=0
  export bb_gfx_on
  if [ "$bb_gfx" = "0" ]; then
    return 0
  fi
  set bb_g_dir="$prefix/themes/beast"
  if [ "$bb_platform" != "efi" ]; then
    set bb_g_theme="$bb_g_dir/theme-pc.txt"
  elif [ "$bb_sb" = "1" ]; then
    set bb_g_theme="$bb_g_dir/theme-efi-sb.txt"
  else
    set bb_g_theme="$bb_g_dir/theme-efi.txt"
  fi
  if [ -n "$bb_theme" -a -n "$bb_data" ]; then
    if [ -f "($bb_data)$bb_theme" ]; then
      set bb_g_theme="($bb_data)$bb_theme"
    fi
  fi
  if [ -f "$bb_g_theme" ]; then
    true
  else
    return 1
  fi
  # Fonts. UEFI: from the memdisk inside the signed grubx64.efi - with Secure
  # Boot on, GRUB refuses font files from disk. "loadfont NAME" (no path)
  # looks for (memdisk)/fonts/NAME.pf2 first. Legacy BIOS: from the ESP.
  if [ "$bb_platform" = "efi" ]; then
    set bb_g_fdir="(memdisk)/fonts"
  else
    set bb_g_fdir="$prefix/fonts"
  fi
  for bb_g_f in NotoSans-Regular-20 NotoSans-Bold-20 NotoSans-Regular-16 NotoSansMono-Regular-16; do
    if [ -f "$bb_g_fdir/$bb_g_f.pf2" ]; then
      true
    else
      return 1
    fi
  done
  # UEFI: these modules are embedded. Legacy BIOS: load them now.
  if [ "$bb_platform" = "pc" ]; then
    for bb_g_m in all_video font gfxterm gfxterm_background gfxmenu png; do
      if insmod $bb_g_m; then
        true
      else
        return 1
      fi
    done
  fi
  for bb_g_f in NotoSans-Regular-20 NotoSans-Bold-20 NotoSans-Regular-16 NotoSansMono-Regular-16; do
    if [ "$bb_platform" = "efi" ]; then
      set bb_g_font="$bb_g_f"
    else
      set bb_g_font="$bb_g_fdir/$bb_g_f.pf2"
    fi
    if loadfont "$bb_g_font"; then
      true
    else
      return 1
    fi
  done
  # GNU Unifont from the ESP for characters the Noto fonts lack (other
  # scripts in file names). Not possible under Secure Boot (font on disk).
  if [ "$bb_sb" != "1" ]; then
    if [ -f "$prefix/fonts/unicode.pf2" ]; then
      loadfont "$prefix/fonts/unicode.pf2"
    fi
  fi
  if [ -n "$bb_gfxmode" ]; then
    set gfxmode="$bb_gfxmode"
  else
    set gfxmode="1920x1080,1280x720,1024x768,auto"
  fi
  # gfxterm replaces the firmware console; the serial terminal (bb_serial)
  # keeps getting the text menu. If no video mode can be set, terminal_output
  # fails and leaves the terminals as they were.
  if [ "$bb_serial_on" = "1" ]; then
    if terminal_output gfxterm serial; then
      true
    else
      return 1
    fi
  else
    if terminal_output gfxterm; then
      true
    else
      return 1
    fi
  fi
  set theme="$bb_g_theme"
  export theme gfxmode
  # Console colours (console box of the theme; "black" shows the background).
  set bb_console_bg="#10153A"
  set bb_console_fg=white
  if [ -f "$bb_g_dir/console.cfg" ]; then
    source "$bb_g_dir/console.cfg"
  fi
  background_color "$bb_console_bg"
  set color_normal="$bb_console_fg/black"
  set bb_gfx_on=1
}

# ---------------------------------------------------------------------------
# Numbers (GRUB script has no arithmetic: decimal strings, digit by digit)
# ---------------------------------------------------------------------------

# bb_inc N  -- bb_inc_out = N + 1
function bb_inc {
  set bb_i_in="$1"
  set bb_inc_out=""
  set bb_i_c=1
  while regexp --set=1:bb_i_in --set=2:bb_i_d -- '^(.*)([0-9])$' "$bb_i_in"; do
    if [ "$bb_i_c" = "1" ]; then
      if [ "$bb_i_d" = "9" ]; then
        set bb_i_d=0
      else
        regexp --set=1:bb_i_d -- "$bb_i_d(.)" "0123456789"
        set bb_i_c=0
      fi
    fi
    set bb_inc_out="$bb_i_d$bb_inc_out"
  done
  if [ "$bb_i_c" = "1" ]; then
    set bb_inc_out="1$bb_inc_out"
  fi
}

# bb_add A B  -- bb_add_out = A + B. A digit sum (0..19) is looked up by
# skipping that many characters of a table with regexp intervals.
function bb_add {
  set bb_a_x="$1"
  set bb_a_y="$2"
  set bb_add_out=""
  set bb_a_c=0
  while true; do
    set bb_a_dx=0
    set bb_a_dy=0
    set bb_a_more=0
    if regexp --set=1:bb_a_x --set=2:bb_a_dx -- '^(.*)([0-9])$' "$bb_a_x"; then
      set bb_a_more=1
    fi
    if regexp --set=1:bb_a_y --set=2:bb_a_dy -- '^(.*)([0-9])$' "$bb_a_y"; then
      set bb_a_more=1
    fi
    if [ "$bb_a_more" = "0" ]; then
      break
    fi
    regexp --set=1:bb_a_s -- "^.{$bb_a_dx}.{$bb_a_dy}.{$bb_a_c}(.)" "01234567890123456789"
    regexp --set=1:bb_a_c -- "^.{$bb_a_dx}.{$bb_a_dy}.{$bb_a_c}(.)" "00000000001111111111"
    set bb_add_out="$bb_a_s$bb_add_out"
  done
  if [ "$bb_a_c" = "1" ]; then
    set bb_add_out="1$bb_add_out"
  fi
}

# ---------------------------------------------------------------------------
# System information from SMBIOS (docs/MENU.md "System information")
#
# GRUB prints an error for every failed smbios lookup, even inside "if", so
# nothing here asks for a structure or field that may not exist: the table is
# walked by position (--match N without --type; the walk ends at the
# end-of-table structure, type 127), and a structure's length byte is checked
# before a field is read, a string's index byte before the string. Missing
# values come out empty and are shown as "unknown".
# ---------------------------------------------------------------------------

# bb_smb_walk  -- bb_smb_t0/t1/t2: position of the first BIOS (0), system (1)
# and baseboard (2) structure; bb_smb_cpus/bb_smb_mems: positions of all
# processor (4) and memory device (17) structures. Empty when absent.
function bb_smb_walk {
  set bb_smb_t0=""
  set bb_smb_t1=""
  set bb_smb_t2=""
  set bb_smb_cpus=""
  set bb_smb_mems=""
  set bb_w_n=1
  while smbios --match "$bb_w_n" --get-byte 0 --set bb_w_t; do
    if [ "$bb_w_t" = "127" ]; then
      break
    elif [ "$bb_w_t" = "0" -a -z "$bb_smb_t0" ]; then
      set bb_smb_t0="$bb_w_n"
    elif [ "$bb_w_t" = "1" -a -z "$bb_smb_t1" ]; then
      set bb_smb_t1="$bb_w_n"
    elif [ "$bb_w_t" = "2" -a -z "$bb_smb_t2" ]; then
      set bb_smb_t2="$bb_w_n"
    elif [ "$bb_w_t" = "4" ]; then
      set bb_smb_cpus="$bb_smb_cpus $bb_w_n"
    elif [ "$bb_w_t" = "17" ]; then
      set bb_smb_mems="$bb_smb_mems $bb_w_n"
    fi
    bb_inc "$bb_w_n"
    set bb_w_n="$bb_inc_out"
    if [ "$bb_w_n" -gt 1024 ]; then
      break
    fi
  done
}

# bb_smb_get N KIND OFFSET END  -- field of structure N (bb_smb_walk position)
# into bb_v. KIND: byte word dword string uuid; END = OFFSET + field size
# (the structure must be at least that long). Returns 1 (bb_v="") if absent.
function bb_smb_get {
  set bb_v=""
  if [ -z "$1" ]; then
    return 1
  fi
  smbios --match "$1" --get-byte 1 --set bb_g_len
  if [ "$bb_g_len" -lt "$4" ]; then
    return 1
  fi
  if [ "$2" = "string" ]; then
    smbios --match "$1" --get-byte "$3" --set bb_g_idx
    if [ "$bb_g_idx" = "0" ]; then
      return 1
    fi
    smbios --match "$1" --get-string "$3" --set bb_v
  else
    smbios --match "$1" "--get-$2" "$3" --set bb_v
  fi
  if [ -z "$bb_v" ]; then
    return 1
  fi
  return 0
}

# bb_real VALUE  -- false for the placeholders firmware puts in unset fields.
function bb_real {
  if [ -z "$1" ]; then
    return 1
  fi
  if regexp -- '^ *$|^([tT]o [bB]e [fF]illed.*|[dD]efault [sS]tring|[sS]ystem [mM]anufacturer|[sS]ystem [pP]roduct [nN]ame|[sS]ystem [vV]ersion|[sS]ystem [sS]erial [nN]umber|O\.?E\.?M\.?|[nN]one|[nN]ot [aA]pplicable|[nN]ot [sS]pecified|[nN]/[aA]|[uU]nknown|0+|0123456789|1234567890|x+|X+)$' "$1"; then
    return 1
  fi
  return 0
}

# bb_sys_summary  -- title of the root menu's System entry, in bb_sys_title, e.g.
# "System: QEMU Standard PC (Q35 + ICH9, 2009) · UEFI · Secure Boot on".
function bb_sys_summary {
  bb_smb_walk
  set bb_sys_name=""
  bb_smb_get "$bb_smb_t1" string 4 5
  set bb_t_man="$bb_v"
  bb_smb_get "$bb_smb_t1" string 5 6
  set bb_t_prod="$bb_v"
  bb_smb_get "$bb_smb_t1" string 6 7
  set bb_t_ver="$bb_v"
  # Lenovo puts the model name in "version" and a machine type in "product".
  if regexp -- '^[lL][eE][nN][oO][vV][oO]' "$bb_t_man"; then
    if bb_real "$bb_t_ver"; then
      set bb_t_prod="$bb_t_ver"
    fi
  fi
  # Short form for the title: "Standard PC (Q35 + ICH9, 2009)" -> "Standard PC".
  regexp --set=1:bb_t_prod -- '^(.*[^ ]) *\([^()]*\)$' "$bb_t_prod"
  if bb_real "$bb_t_man"; then
    set bb_sys_name="$bb_t_man"
  fi
  if bb_real "$bb_t_prod"; then
    if [ -n "$bb_sys_name" ]; then
      set bb_sys_name="$bb_sys_name $bb_t_prod"
    else
      set bb_sys_name="$bb_t_prod"
    fi
  fi
  if [ -z "$bb_sys_name" ]; then
    set bb_sys_name="unknown machine"
  fi
  # The middle dot only where every terminal can show it (a serial terminal
  # shows "?" for anything that is not ASCII).
  if [ "$bb_gfx_on" = "1" -a "$bb_serial_on" != "1" ]; then
    set bb_t_sep=" · "
  else
    set bb_t_sep=" - "
  fi
  if [ "$bb_platform" = "efi" ]; then
    if [ "$bb_sb" = "1" ]; then
      set bb_sys_title="System: $bb_sys_name${bb_t_sep}UEFI${bb_t_sep}Secure Boot on"
    else
      set bb_sys_title="System: $bb_sys_name${bb_t_sep}UEFI${bb_t_sep}Secure Boot off"
    fi
  else
    set bb_sys_title="System: $bb_sys_name${bb_t_sep}Legacy BIOS"
  fi
}

# bb_or_unknown VALUE  -- bb_v = VALUE, or "unknown" when it is empty
function bb_or_unknown {
  if [ -n "$1" ]; then
    set bb_v="$1"
  else
    set bb_v=unknown
  fi
}

# bb_mb2gb MB  -- bb_gb = the size in GB when MB is a whole number of the
# usual module and total sizes, else empty
function bb_mb2gb {
  set bb_gb=""
  regexp --set=1:bb_gb -- ",$1=([0-9]+)," ",1024=1,2048=2,3072=3,4096=4,6144=6,8192=8,10240=10,12288=12,16384=16,20480=20,24576=24,32768=32,40960=40,49152=48,65536=64,81920=80,98304=96,131072=128,196608=192,262144=256,393216=384,524288=512,786432=768,1048576=1024,"
}

# bb_sysinfo  -- the System information page.
function bb_sysinfo {
  bb_smb_walk
  echo "System information"
  echo ""
  # System (type 1)
  bb_smb_get "$bb_smb_t1" string 4 5
  set bb_p_a="$bb_v"
  bb_smb_get "$bb_smb_t1" string 5 6
  if [ -n "$bb_p_a" -a -n "$bb_v" ]; then
    set bb_v="$bb_p_a $bb_v"
  elif [ -n "$bb_p_a" ]; then
    set bb_v="$bb_p_a"
  fi
  bb_or_unknown "$bb_v"
  echo "System       $bb_v"
  bb_smb_get "$bb_smb_t1" string 6 7
  bb_or_unknown "$bb_v"
  set bb_p_a="$bb_v"
  bb_smb_get "$bb_smb_t1" string 26 27
  bb_or_unknown "$bb_v"
  echo "             version $bb_p_a, family $bb_v"
  bb_smb_get "$bb_smb_t1" string 7 8
  bb_or_unknown "$bb_v"
  set bb_p_a="$bb_v"
  bb_smb_get "$bb_smb_t1" uuid 8 24
  if regexp -- '^(0{8}-0{4}-0{4}-0{4}-0{12}|[fF]{8}-[fF]{4}-[fF]{4}-[fF]{4}-[fF]{12})$' "$bb_v"; then
    set bb_v=""
  fi
  bb_or_unknown "$bb_v"
  echo "             serial $bb_p_a, UUID $bb_v"
  # Baseboard (type 2, optional)
  if [ -n "$bb_smb_t2" ]; then
    bb_smb_get "$bb_smb_t2" string 4 5
    set bb_p_a="$bb_v"
    bb_smb_get "$bb_smb_t2" string 5 6
    if [ -n "$bb_p_a" -a -n "$bb_v" ]; then
      set bb_v="$bb_p_a $bb_v"
    elif [ -n "$bb_p_a" ]; then
      set bb_v="$bb_p_a"
    fi
    bb_or_unknown "$bb_v"
    set bb_p_a="$bb_v"
    bb_smb_get "$bb_smb_t2" string 6 7
    if [ -n "$bb_v" ]; then
      echo "Board        $bb_p_a, version $bb_v"
    else
      echo "Board        $bb_p_a"
    fi
  else
    echo "Board        unknown (not reported by the firmware)"
  fi
  # Firmware (type 0)
  bb_smb_get "$bb_smb_t0" string 4 5
  bb_or_unknown "$bb_v"
  echo "Firmware     $bb_v"
  bb_smb_get "$bb_smb_t0" string 5 6
  bb_or_unknown "$bb_v"
  set bb_p_a="$bb_v"
  bb_smb_get "$bb_smb_t0" string 8 9
  bb_or_unknown "$bb_v"
  echo "             version $bb_p_a, released $bb_v"
  if [ "$bb_platform" = "efi" ]; then
    echo "Boot mode    UEFI ($grub_cpu-$grub_platform)"
    if [ "$bb_sb" = "1" ]; then
      echo "Secure Boot  on: GRUB is locked down, shim checks every kernel it starts"
    else
      echo "Secure Boot  off (or not enforced): unsigned kernels can start"
    fi
  else
    echo "Boot mode    legacy BIOS ($grub_cpu-$grub_platform)"
    echo "Secure Boot  not available in legacy BIOS mode"
  fi
  # Processors (type 4): populated sockets only (status byte bit 6)
  if cpuid -l; then
    set bb_p_64="64-bit"
  else
    set bb_p_64="32-bit only"
  fi
  set bb_p_lab="Processor   "
  set bb_p_n=0
  for bb_p_i in $bb_smb_cpus; do
    bb_smb_get "$bb_p_i" byte 24 25
    if [ -n "$bb_v" ]; then
      if [ "$bb_v" -lt 64 ]; then
        continue
      fi
    fi
    bb_smb_get "$bb_p_i" string 16 17
    if [ -z "$bb_v" ]; then
      bb_smb_get "$bb_p_i" string 7 8
    fi
    bb_or_unknown "$bb_v"
    echo "$bb_p_lab $bb_v"
    set bb_p_lab="            "
    set bb_p_d=""
    bb_smb_get "$bb_p_i" byte 35 36
    set bb_p_c="$bb_v"
    if [ "$bb_p_c" = "255" ]; then
      bb_smb_get "$bb_p_i" word 42 44
      set bb_p_c="$bb_v"
    fi
    if [ -n "$bb_p_c" -a "$bb_p_c" != "0" ]; then
      set bb_p_d="$bb_p_c cores, "
    fi
    bb_smb_get "$bb_p_i" byte 37 38
    set bb_p_c="$bb_v"
    if [ "$bb_p_c" = "255" ]; then
      bb_smb_get "$bb_p_i" word 46 48
      set bb_p_c="$bb_v"
    fi
    if [ -n "$bb_p_c" -a "$bb_p_c" != "0" ]; then
      set bb_p_d="$bb_p_d$bb_p_c threads, "
    fi
    bb_smb_get "$bb_p_i" word 22 24
    if [ -n "$bb_v" -a "$bb_v" != "0" ]; then
      set bb_p_d="$bb_p_d$bb_v MHz now, "
    fi
    bb_smb_get "$bb_p_i" word 20 22
    if [ -n "$bb_v" -a "$bb_v" != "0" ]; then
      set bb_p_d="$bb_p_d$bb_v MHz max, "
    fi
    echo "             $bb_p_d$bb_p_64"
    set bb_p_n=1
  done
  if [ "$bb_p_n" = "0" ]; then
    echo "Processor    unknown, $bb_p_64"
  fi
  # Memory devices (type 17): one line per populated slot (8 at most), total
  set bb_p_lab="Memory      "
  set bb_m_tot=0
  set bb_m_used=0
  set bb_m_slots=0
  set bb_m_more=0
  set bb_m_gb=0
  set bb_m_exact=1
  for bb_p_i in $bb_smb_mems; do
    bb_inc "$bb_m_slots"
    set bb_m_slots="$bb_inc_out"
    bb_smb_get "$bb_p_i" word 12 14
    set bb_m_sz="$bb_v"
    if [ -z "$bb_m_sz" -o "$bb_m_sz" = "0" ]; then
      continue
    fi
    if [ "$bb_m_sz" = "32767" ]; then
      bb_smb_get "$bb_p_i" dword 28 32
      set bb_m_sz="$bb_v"
    fi
    bb_inc "$bb_m_used"
    set bb_m_used="$bb_inc_out"
    if [ "$bb_m_sz" = "65535" -o -z "$bb_m_sz" ]; then
      set bb_m_txt="size unknown"
      set bb_m_exact=0
    elif [ "$bb_m_sz" -ge 32768 ]; then
      set bb_m_txt="under 32 MB"
      set bb_m_exact=0
    else
      set bb_m_txt="$bb_m_sz MB"
      bb_add "$bb_m_tot" "$bb_m_sz"
      set bb_m_tot="$bb_add_out"
      bb_mb2gb "$bb_m_sz"
      if [ -n "$bb_gb" ]; then
        bb_add "$bb_m_gb" "$bb_gb"
        set bb_m_gb="$bb_add_out"
      else
        set bb_m_gb=""
      fi
    fi
    bb_smb_get "$bb_p_i" byte 18 19
    set bb_m_t=""
    regexp --set=1:bb_m_t -- ",$bb_v=([^,]+)," ",3=DRAM,7=RAM,15=SDRAM,18=DDR,19=DDR2,20=DDR2 FB-DIMM,24=DDR3,26=DDR4,27=LPDDR,28=LPDDR2,29=LPDDR3,30=LPDDR4,32=HBM,33=HBM2,34=DDR5,35=LPDDR5,36=HBM3,"
    if [ -n "$bb_m_t" ]; then
      set bb_m_txt="$bb_m_txt $bb_m_t"
    fi
    bb_smb_get "$bb_p_i" word 21 23
    if [ -n "$bb_v" -a "$bb_v" != "0" ]; then
      set bb_m_txt="$bb_m_txt $bb_v MT/s"
    fi
    bb_smb_get "$bb_p_i" string 23 24
    if bb_real "$bb_v"; then
      set bb_m_txt="$bb_m_txt, $bb_v"
    fi
    bb_smb_get "$bb_p_i" string 16 17
    bb_or_unknown "$bb_v"
    if [ "$bb_m_used" -le 8 ]; then
      echo "$bb_p_lab $bb_v: $bb_m_txt"
      set bb_p_lab="            "
    else
      set bb_m_more=1
    fi
  done
  if [ "$bb_m_used" = "0" ]; then
    echo "Memory       unknown (no memory devices reported)"
  else
    if [ "$bb_m_more" = "1" ]; then
      echo "             (more modules not listed)"
    fi
    set bb_v="$bb_m_tot MB"
    if [ -n "$bb_m_gb" ]; then
      set bb_v="$bb_v ($bb_m_gb GB)"
    fi
    if [ "$bb_m_exact" = "0" ]; then
      set bb_v="at least $bb_v"
    fi
    echo "             total $bb_v in $bb_m_used of $bb_m_slots slots"
  fi
  echo -n "Clock        "
  date
  if [ "$bb_gfx_on" = "1" ]; then
    echo "Display      graphical menu, first available mode of $gfxmode"
  else
    echo "Display      text console"
  fi
  echo ""
  bb_or_unknown "$bb_build_id"
  echo "beast-booter $bb_version, build $bb_v"
  if [ -n "$bb_data" ]; then
    bb_or_unknown "$bb_data_label"
    set bb_p_a="$bb_v"
    bb_or_unknown "$bb_data_uuid_linux"
    echo "Data         ($bb_data) $bb_data_fs, label $bb_p_a, UUID $bb_v"
  else
    echo "Data         not found"
  fi
  bb_or_unknown "$bb_layout"
  echo "Boot         ($bb_esp), partition table $bb_v"
  bb_pause
}

# ---------------------------------------------------------------------------
# Tool entries (root menu only)
# ---------------------------------------------------------------------------

# bb_beastnet  -- start the beast-net helper (docs/BEASTNET.md): it downloads
# an ISO from a link onto the data partition, then reboots into this menu,
# which boots that ISO once (bb_oneshot in the ESP's grubenv). The helper
# kernel is Ubuntu's signed kernel, verified by shim like any distro kernel.
function bb_beastnet {
  set bb_iso="beast-net"
  set bb_bn="($bb_esp)/beast-net"
  set bb_bn_esp_uuid=""
  probe --fs-uuid --set=bb_bn_esp_uuid "($bb_esp)"
  set bb_bn_dbg="beastnet.debug=0"
  if [ "$bb_debug" = "1" ]; then
    set bb_bn_dbg="beastnet.debug=1"
  fi
  # The last console= is the helper's console; an empty beastnet.ui= or
  # beastnet.script= means "not set" to the helper.
  set bb_bn_con="console=tty0"
  set bb_bn_ui="beastnet.ui="
  if [ "$bb_serial_on" = "1" ]; then
    set bb_bn_con="console=ttyS0,115200"
    set bb_bn_ui="beastnet.ui=plain"
  fi
  set bb_bn_script="beastnet.script="
  if [ -n "$bb_beastnet_script" ]; then
    set bb_bn_script="beastnet.script=$bb_beastnet_script"
  fi
  bb_dbg "boot beast-net recipe=beast-net"
  bb_linux "$bb_bn/vmlinuz" "beastnet.data=UUID=$bb_data_uuid_linux" "beastnet.esp=UUID=$bb_bn_esp_uuid" "beastnet.sb=$bb_sb" "$bb_bn_dbg" console=tty0 "$bb_bn_con" "$bb_bn_ui" "$bb_bn_script" quiet
  if [ "$bb_ok" != "1" ]; then
    bb_fail linux
    return 1
  fi
  # Installed firmware packs ride along as extra initrds. An unmatched glob
  # stays literal in GRUB, so only pass it when at least one pack exists.
  set bb_bn_fw=0
  for bb_f in $bb_bn/firmware/*.cpio; do
    if [ -f "$bb_f" ]; then
      set bb_bn_fw=1
    fi
  done
  if [ "$bb_bn_fw" = "1" ]; then
    bb_initrd "$bb_bn/initrd.img" $bb_bn/firmware/*.cpio
  else
    bb_initrd "$bb_bn/initrd.img"
  fi
  if [ "$bb_ok" != "1" ]; then
    bb_fail initrd
    return 1
  fi
  if [ "$bb_dryrun" = "1" ]; then
    return 0
  fi
  boot
  bb_fail boot
  return 1
}

function bb_tools {
  bb_sys_summary
  menuentry "$bb_sys_title" --class=info {
    bb_sysinfo
  }
  if [ -f "($bb_esp)/beast-net/vmlinuz" -a -f "($bb_esp)/beast-net/initrd.img" ]; then
    menuentry "Download an ISO from a link" --class=network --class=tool {
      bb_beastnet
    }
  fi
  menuentry "Secure Boot status / help" --class=shield --class=help {
    bb_sb_help
  }
  if [ "$bb_platform" = "efi" ]; then
    menuentry "Enroll a key (MokManager)" --class=key --class=tool {
      bb_mok
    }
    menuentry "UEFI firmware settings" --class=firmware --class=tool {
      bb_fwsetup
    }
  fi
  menuentry "Reboot" --class=reboot {
    reboot
  }
  menuentry "Power off" --class=shutdown {
    halt
  }
}

function bb_sb_help {
  echo "beast-booter $bb_version"
  echo ""
  if [ "$bb_platform" != "efi" ]; then
    echo "This machine started beast-booter in legacy BIOS mode."
    echo "Secure Boot only exists on UEFI, so it does not apply here."
  elif [ "$bb_sb" = "1" ]; then
    echo "Secure Boot is ON. Every kernel or EFI program started from this menu"
    echo "must be signed by a key the machine trusts: the firmware's db, a key"
    echo "you enrolled with MokManager, or the vendor key built into shim"
    echo "(Canonical: Ubuntu-signed kernels work). Others fail with an error."
    echo ""
    echo "To trust another distribution, enroll its key with \"Enroll a key"
    echo "(MokManager)\" (if the distribution publishes one), or turn Secure Boot"
    echo "off in the firmware settings."
  else
    echo "Secure Boot is OFF (or not enforced). Unsigned kernels can start."
  fi
  echo ""
  echo "Data partition: ($bb_data) $bb_data_fs, ISOs are listed from its root."
  echo "Boot partition: ($bb_esp)"
  bb_pause
}

function bb_no_data_text {
  echo "beast-booter could not find its data partition (partition 1, where the"
  echo "ISO files live)."
  if [ "$bb_sb" = "1" -a "$bb_data_fs" = "ntfs" ]; then
    echo ""
    echo "The data partition is NTFS and Secure Boot is on. GRUB switches its"
    echo "NTFS driver off under Secure Boot, so it cannot read the partition."
    echo "Use exFAT or FAT32 for the data partition, or turn Secure Boot off."
  else
    echo "The drive may have been repartitioned, or partition 1 reformatted with"
    echo "a filesystem GRUB cannot read. Supported: exFAT, FAT32, NTFS."
  fi
  echo "The tools in the menu still work."
}

function bb_mok {
  set bb_ctx=menu
  set bb_grub_err=0
  set bb_iso="MokManager"
  set bb_mm="($bb_esp)/EFI/BOOT/mmx64.efi"
  if [ -f "$bb_mm" ]; then
    true
  else
    echo "MokManager (EFI/BOOT/mmx64.efi) is missing from the boot partition."
    bb_pause
    return 1
  fi
  if [ "$bb_dryrun" = "1" ]; then
    bb_dry "chainloader $bb_mm"
    return 0
  fi
  if ! chainloader "$bb_mm"; then
    bb_fail chainloader
    return 1
  fi
  boot
  bb_fail boot
}

function bb_fwsetup {
  if fwsetup --is-supported; then
    fwsetup
  fi
  echo "This firmware does not offer a way to open its settings from here."
  echo "Restart the machine and press its setup key (often F2, F10, Del or Esc)."
  bb_pause
}
