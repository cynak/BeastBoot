# beast-booter main menu (docs/MENU.md, docs/ARCHITECTURE.md section 5).
# Sourced by grub.cfg after version.cfg and device.cfg.

# Modules. UEFI: every module is embedded in the GRUB image (with Secure Boot
# on, GRUB lockdown forbids loading modules from disk), so nothing is loaded.
# Legacy BIOS: load from $prefix/i386-pc. regexp must be loaded before any
# wildcard (*) is used: it provides GRUB's file name globbing.
if [ "$grub_platform" = "pc" ]; then
  for bb_m in regexp echo test true probe search search_fs_uuid loopback iso9660 udf fat exfat ntfs part_msdos part_gpt linux boot configfile sleep halt reboot serial terminfo terminal smbios cpuid date loadenv; do
    insmod $bb_m
  done
fi

source "$bb_cfg/lib.cfg"

# ---------------------------------------------------------------------------
# Platform
# ---------------------------------------------------------------------------

set bb_platform="$grub_platform"
if [ "$lockdown" = "y" ]; then
  set bb_sb=1
else
  set bb_sb=0
fi
if [ -z "$bb_version" ]; then
  set bb_version=unknown
fi
set bb_serial_on=0
if [ "$bb_serial" = "1" ]; then
  bb_serial_enable
fi

# ---------------------------------------------------------------------------
# Devices
# ---------------------------------------------------------------------------

# The ESP is the device in $prefix: (hd0,msdos2)/grub -> hd0,msdos2. A
# partition-only prefix such as (,gpt2) gets the disk of $root.
set bb_esp=""
regexp --set=1:bb_esp -- '^\(([^)]*)\)' "$prefix"
if [ -z "$bb_esp" ]; then
  set bb_esp="$root"
fi
if regexp --set=1:bb_t -- '^(,.*)$' "$bb_esp"; then
  regexp --set=1:bb_disk -- '^([^,]*)' "$root"
  set bb_esp="$bb_disk$bb_t"
fi

# Partition 1 of the disk that holds the ESP: hd0,msdos2 -> hd0,msdos1.
set bb_p1=""
if regexp --set=1:bb_t -- '^(.*,[a-z]*)[0-9]+$' "$bb_esp"; then
  set bb_p1="${bb_t}1"
fi

# Data partition: the partition with bb_data_uuid (device.cfg), preferring
# partition 1 of our own disk (two drives made from one image share the
# UUID); then a UUID search over all disks; then partition 1 of our disk.
set bb_data=""
set bb_data_by=""
if [ -n "$bb_data_uuid" ]; then
  if [ -n "$bb_p1" ]; then
    if [ -e "($bb_p1)/" ]; then
      probe --fs-uuid --set=bb_t "($bb_p1)"
      bb_upper "$bb_t"
      set bb_t="$bb_upper_out"
      bb_upper "$bb_data_uuid"
      if [ "$bb_t" = "$bb_upper_out" ]; then
        set bb_data="$bb_p1"
      fi
    fi
  fi
  if [ -z "$bb_data" ]; then
    search --no-floppy --fs-uuid --set=bb_data "$bb_data_uuid"
  fi
  if [ -n "$bb_data" ]; then
    set bb_data_by=uuid
  fi
fi
if [ -z "$bb_data" -a -n "$bb_p1" ]; then
  if [ -e "($bb_p1)/" ]; then
    set bb_data="$bb_p1"
    set bb_data_by=fallback
  fi
fi

# Facts about the data partition. When it was not found by UUID, the
# device.cfg values describe some other filesystem: probe them instead.
if [ -n "$bb_data" ]; then
  probe --fs --set=bb_t "($bb_data)"
  if [ "$bb_data_by" = "fallback" -o -z "$bb_data_fs" ]; then
    if [ "$bb_t" = "fat" ]; then
      set bb_data_fs=fat32
    else
      set bb_data_fs="$bb_t"
    fi
  fi
  if [ "$bb_data_by" = "fallback" -o -z "$bb_data_uuid_linux" ]; then
    probe --fs-uuid --set=bb_data_uuid "($bb_data)"
    bb_upper "$bb_data_uuid"
    set bb_data_uuid_linux="$bb_upper_out"
  fi
  if [ "$bb_data_by" = "fallback" -o -z "$bb_data_label" ]; then
    probe --label --set=bb_data_label "($bb_data)"
  fi
fi

# ---------------------------------------------------------------------------
# User configuration: /beast-booter/config.cfg on the data partition
# ---------------------------------------------------------------------------

if [ -n "$bb_data" ]; then
  if [ -f "($bb_data)/beast-booter/config.cfg" ]; then
    source "($bb_data)/beast-booter/config.cfg"
  fi
fi
if [ "$bb_serial" = "1" ]; then
  bb_serial_enable
fi
bb_serial_wide

set bb_path="/"
export bb_cfg bb_esp bb_data bb_platform bb_sb bb_path bb_version bb_build_id
export bb_debug bb_dryrun bb_serial bb_serial_on bb_beastnet_script
export bb_install_id bb_layout bb_data_fs bb_data_uuid bb_data_uuid_linux bb_data_label

# ---------------------------------------------------------------------------
# Menu
# ---------------------------------------------------------------------------

bb_dbg_nl
if [ -z "$bb_data" ]; then
  bb_dbg "ready version=$bb_version platform=$bb_platform sb=$bb_sb esp=$bb_esp data=none fs=none"
  bb_err no-data-partition "no data partition found (uuid=$bb_data_uuid esp=$bb_esp)"
  bb_no_data_text
  bb_gfx_init
  menuentry "No data partition found - help" --class=help {
    bb_no_data_text
    bb_pause
  }
  bb_tools
else
  bb_dbg "ready version=$bb_version platform=$bb_platform sb=$bb_sb esp=$bb_esp data=$bb_data fs=$bb_data_fs"
  # One-shot hand-off from the beast-net helper (docs/BEASTNET.md section 4):
  # clear bb_oneshot first, and boot the ISO only if clearing worked, so a
  # failing ISO can never put the machine in a reboot loop.
  set bb_oneshot=""
  if [ -f "($bb_esp)/grub/grubenv" ]; then
    load_env --file "($bb_esp)/grub/grubenv" bb_oneshot
  fi
  if [ -n "$bb_oneshot" ]; then
    set bb_oneshot_iso="$bb_oneshot"
    set bb_oneshot=""
    if save_env --file "($bb_esp)/grub/grubenv" bb_oneshot; then
      bb_dbg "oneshot $bb_oneshot_iso"
      set bb_autoboot="$bb_oneshot_iso"
    else
      bb_dbg "error oneshot-not-cleared $bb_oneshot_iso"
      echo "beast-booter: could not clear the one-time boot entry, so $bb_oneshot_iso"
      echo "is not started automatically. It is on the drive under /downloads/."
    fi
  fi
  if [ -n "$bb_autoboot" ]; then
    bb_boot_iso "$bb_autoboot" auto
  fi
  bb_gfx_init
  bb_list / menu
  bb_tools
fi
