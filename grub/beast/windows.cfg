# beast-booter: what to start from a Windows installation ISO (bb_r_windows
# in lib.cfg). Its own configfile context, so Esc returns to the ISO list;
# bb_r_windows exported bb_iso, and the ISO is still open as (loop).
set bb_ctx=menu
set bb_grub_err=0
set timeout=-1
bb_dbg "windows-menu $bb_iso"
menuentry "Install Windows (start Windows Setup from the ISO)" --class=windows {
  bb_win_boot setup
}
menuentry "Windows PE command prompt (repair and tools, no Setup)" --class=windows {
  bb_win_boot pe
}
