# beast-boot: offer to prepare a Windows ISO for Secure Boot (bb_r_wb_prepare
# in lib.cfg). Its own configfile context, so Esc returns to the ISO list;
# bb_r_wb_prepare exported bb_iso.
set bb_ctx=menu
set bb_grub_err=0
set timeout=-1
bb_dbg "windows-prepare-menu $bb_iso"
menuentry "Prepare this Windows ISO for Secure Boot" --class=windows {
  bb_wb_prepare
}
