# beast-boot GRUB entry point.
#
# Loaded as $prefix/grub.cfg:
#   UEFI         $prefix is (memdisk)/grub, the memdisk inside the signed
#                grubx64.efi (build/early-efi.cfg). This file, beast/*.cfg,
#                beast/hooks/, the theme and the fonts are read from there and
#                never from the drive.
#   legacy BIOS  $prefix is (<ESP device>)/grub.
# Everything interesting lives in $prefix/beast/:
#
#   version.cfg  generated by the build (bb_version, bb_build_id)
#   main.cfg     the menu
#
# Files written per drive or at run time are data, read with load_env and a
# list of names, never run: grub/beast/device.env and grub/grubenv on the ESP,
# /beast-booter/config.env on the data partition (main.cfg).
#
# See docs/ARCHITECTURE.md (section 5) and docs/MENU.md.

set bb_cfg="$prefix/beast"
export bb_cfg

if [ -f "$bb_cfg/version.cfg" ]; then
  source "$bb_cfg/version.cfg"
fi
source "$bb_cfg/main.cfg"
