# beast-boot GRUB entry point.
#
# Loaded as $prefix/grub.cfg, where $prefix is (<ESP device>)/grub on both
# legacy BIOS and UEFI. Everything interesting lives in $prefix/beast/:
#
#   version.cfg  generated by the build (bb_version, bb_build_id)
#   device.cfg   written by the installer (may be missing)
#   main.cfg     the menu
#
# See docs/ARCHITECTURE.md (section 5) and docs/MENU.md.

set bb_cfg="$prefix/beast"
export bb_cfg

if [ -f "$bb_cfg/version.cfg" ]; then
  source "$bb_cfg/version.cfg"
fi
if [ -f "$bb_cfg/device.cfg" ]; then
  source "$bb_cfg/device.cfg"
fi
source "$bb_cfg/main.cfg"
