[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "beast-boot"
description = "Create and update beast-boot multi-boot USB drives and images"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = []  # standard library only; NTFS on Linux needs mkfs.ntfs (ntfs-3g)
dynamic = ["version"]

[project.scripts]
beast-boot = "beastbooter.cli:main"

[tool.setuptools]
packages = ["beastbooter"]

[tool.setuptools.dynamic]
version = { attr = "beastbooter.__version__" }  # read from the repo's VERSION file
