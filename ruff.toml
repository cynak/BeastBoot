# ruff (https://docs.astral.sh/ruff/, MIT licence) settings for beast-booter.
# Run through scripts/lint.sh (or `make lint`); editors pick this file up too.
# See docs/CODE_QUALITY.md.

# The installer, bb-dev and beast-net support Python 3.10+.
target-version = "py310"
line-length = 120

# Replaces ruff's default list on purpose: the default skips every directory
# named "build", and build/ holds Python sources here. .gitignore'd paths
# (out/, dist/, .tools/, .venv/, ...) are skipped as well.
exclude = [
    ".git",
    ".tools",
    ".venv",
    ".ruff_cache",
    ".pytest_cache",
    "__pycache__",
    "out",
    "dist",
]

[lint]
# E4/E7/E9: imports, statements, syntax errors. F: pyflakes (unused names,
# undefined names, ...). UP: pyupgrade for the 3.10 baseline (also flags
# syntax newer than target-version).
select = ["E4", "E7", "E9", "F", "UP"]
ignore = [
    "UP031",  # printf-style "%" formatting is fine; rewriting it is churn
]

[lint.per-file-ignores]
# Test modules and demo scripts put the package directory on sys.path first.
"**/tests/**/*.py" = ["E402"]
"devtools/gdb/demo.py" = ["E402"]
# The argparse table of sub-commands is kept one command per line on purpose.
"build/bbtool.py" = ["E702"]
